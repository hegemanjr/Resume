<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Hegeman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0b;
            --bg2: #111114;
            --bg3: #18181d;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.18);
            --accent: #e8ff47;
            --accent2: #7fffd0;
            --text: #f0f0ee;
            --muted: #888886;
            --faint: #444442;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        html { font-size: 16px; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .noise {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        .grid-lines {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
        }

        .container {
            position: relative; z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 5rem 2rem 6rem;
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .eyebrow::before {
            content: '';
            display: inline-block;
            width: 28px; height: 1px;
            background: var(--accent);
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 1.25rem;
            padding-bottom: 0.1em;
        }

        .role {
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--muted);
            margin-bottom: 2.5rem;
            letter-spacing: 0.01em;
        }
        .role span {
            color: var(--accent2);
            font-weight: 400;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 4.5rem;
            flex-wrap: wrap;
        }
        .social-links a {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .social-links a:hover { color: var(--text); }
        .social-links a svg {
            width: 14px; height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--faint);
            margin-bottom: 1.25rem;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }

        .resume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 3rem;
        }

        .resume-card {
            background: var(--bg2);
            padding: 1.75rem 1.75rem 1.5rem;
            text-decoration: none;
            display: block;
            position: relative;
            transition: background 0.2s;
            overflow: hidden;
        }
        .resume-card:hover { background: var(--bg3); }
        .resume-card.featured { background: var(--bg3); }

        .resume-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        .resume-card.featured::after { transform: scaleX(1); }
        .resume-card:hover::after { transform: scaleX(1); }

        .card-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(232, 255, 71, 0.08);
            border: 1px solid rgba(232, 255, 71, 0.2);
            border-radius: 4px;
            padding: 3px 7px;
            margin-bottom: 1rem;
        }
        .card-tag.general {
            color: var(--accent2);
            background: rgba(127, 255, 208, 0.08);
            border-color: rgba(127, 255, 208, 0.2);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.25rem;
            font-weight: 300;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-format {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--faint);
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-format svg {
            width: 11px; height: 11px;
            stroke: currentColor; fill: none;
            stroke-width: 2;
        }

        .card-arrow {
            width: 28px; height: 28px;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .resume-card:hover .card-arrow {
            border-color: var(--accent);
            background: rgba(232, 255, 71, 0.08);
        }
        .card-arrow svg {
            width: 12px; height: 12px;
            stroke: var(--muted); fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            transition: stroke 0.2s;
        }
        .resume-card:hover .card-arrow svg { stroke: var(--accent); }

        .footer-note {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--faint);
            letter-spacing: 0.05em;
            line-height: 1.8;
        }
        .footer-note a {
            color: var(--faint);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-note a:hover { color: var(--muted); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate { animation: fadeUp 0.6s ease both; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.15s; }
        .d3 { animation-delay: 0.25s; }
        .d4 { animation-delay: 0.35s; }
        .d5 { animation-delay: 0.45s; }

        @media (max-width: 600px) {
            .container { padding: 3rem 1.25rem 4rem; }
            .resume-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
